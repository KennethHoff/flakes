name: Update packages

# Weekly auto-update for every tool under pkgs/. The tool list is discovered
# from the directory tree, and each tool is bumped by its own `update-<name>`
# app — adding a pkgs/<name>/ needs no edit here. Each bump is gated by that
# tool's flake checks: a bump that breaks a build or a check fails the job and
# no PR is opened.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: list
        # JSON array of pkgs/* directory names, e.g. ["cve-lite-cli","playwright-cli","sentry-cli"].
        run: |
          tools=$(find pkgs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -cs .)
          echo "Discovered tools: $tools"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.discover.outputs.tools) }}
    concurrency:
      group: update-${{ matrix.tool }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Run updater
        run: nix run "$GITHUB_WORKSPACE#update-${{ matrix.tool }}"

      - name: Summarize changes
        run: |
          {
            echo "### ${{ matrix.tool }}"
            echo
            if git diff --quiet -- "pkgs/${{ matrix.tool }}/versions.nix"; then
              echo "Already up to date."
            else
              echo '```diff'
              git diff -- "pkgs/${{ matrix.tool }}/versions.nix"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Gate: build only this tool's checks against the dirty working tree (the
      # just-bumped versions.nix) before opening a PR. A failure aborts the job,
      # so create-pull-request below never runs. Scoped to the tool so a bump
      # doesn't rebuild every other tool's checks.
      - name: Gate on this tool's flake checks
        run: |
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          mapfile -t checks < <(
            nix eval --json --apply builtins.attrNames ".#checks.$system" \
              | jq -r '.[]' | grep "^${{ matrix.tool }}-" || true
          )
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "::warning::No checks for ${{ matrix.tool }} — nothing to gate on."
            exit 0
          fi
          attrs=()
          for c in "${checks[@]}"; do attrs+=(".#checks.$system.$c"); done
          printf 'Gating on:%s\n' "$(printf ' %s' "${attrs[@]}")"
          nix build -L --no-link "${attrs[@]}"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: pkgs/${{ matrix.tool }}/versions.nix
          branch: auto-update-${{ matrix.tool }}
          delete-branch: true
          commit-message: "chore(${{ matrix.tool }}): update"
          title: "chore(${{ matrix.tool }}): update"
          body: |
            Automated weekly version bump for `${{ matrix.tool }}`.
            See the workflow run summary for the `versions.nix` diff.

      - name: Merge PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # No required checks gate the PR, so it goes straight to a mergeable
          # ("clean") state and `--auto` is rejected with "clean status". Try
          # auto-merge first (covers the brief window where mergeability is still
          # being computed), then fall back to an immediate squash-merge.
          gh pr merge --auto --squash --delete-branch "$PR" \
            || gh pr merge --squash --delete-branch "$PR"
